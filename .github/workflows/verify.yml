# Daily model-weights verification. Runs the whole matrix against
# api.deeprelay.ai, the vendors' own APIs and independent reference
# deployments per model, then publishes the report to the deeprelay ingest
# endpoints. The verified mark on deeprelay.ai reflects the latest daily run.
#
# Triggers are schedule and workflow_dispatch ONLY. Never pull_request: the
# job holds provider keys, and a PR from a fork must not be able to run with
# them. Contributors get ci.yml (unit tests, no secrets).
#
# Exit contract of run_matrix.py: 0 judged and no mismatch, 2 a mismatch,
# 1 nothing could be judged. A run that measured nothing goes red.
name: verify

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated deeprelay model ids (empty = every model in matrix.json)"
        required: false
        default: ""
      publish:
        description: "Publish the report to the ingest endpoints"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: python3 -m unittest discover -s . -p 'test_*.py'

      - name: Require at least one key
        # A run with no keys at all would skip every lane and report
        # "insufficient" for every model. That must not be a green run.
        env:
          HAS_DEEPRELAY: ${{ secrets.DEEPRELAY_API_KEY != '' }}
          HAS_TOGETHER: ${{ secrets.TOGETHER_API_KEY != '' }}
          HAS_FIREWORKS: ${{ secrets.FIREWORKS_API_KEY != '' }}
          HAS_DASHSCOPE: ${{ secrets.DASHSCOPE_API_KEY != '' }}
          HAS_DEEPSEEK: ${{ secrets.DEEPSEEK_API_KEY != '' }}
          HAS_ZAI: ${{ secrets.ZAI_API_KEY != '' }}
        run: |
          if [ "$HAS_DEEPRELAY" != "true" ]; then
            echo "::error::DEEPRELAY_API_KEY is not configured: the subject lane cannot run, nothing can be judged"
            exit 1
          fi
          if [ "$HAS_TOGETHER" != "true" ] && [ "$HAS_FIREWORKS" != "true" ] && [ "$HAS_DASHSCOPE" != "true" ] && [ "$HAS_DEEPSEEK" != "true" ]; then
            echo "::error::no reference key is configured: no same-model band can be measured"
            exit 1
          fi
          echo "keys: deeprelay=$HAS_DEEPRELAY together=$HAS_TOGETHER fireworks=$HAS_FIREWORKS dashscope=$HAS_DASHSCOPE deepseek=$HAS_DEEPSEEK zai=$HAS_ZAI"

      - name: Run the matrix
        id: run
        env:
          DEEPRELAY_API_KEY: ${{ secrets.DEEPRELAY_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          MODELS: ${{ github.event.inputs.models }}
        run: |
          set +e
          args=()
          if [ -n "$MODELS" ]; then args+=(--models "$MODELS"); fi
          python3 run_matrix.py --json-out report.json --raw-dir raw --summary-out summary.md "${args[@]}"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload the report and raw responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            report.json
            summary.md
            raw/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish to prod
        if: ${{ github.event_name == 'schedule' || github.event.inputs.publish == 'true' }}
        env:
          INGEST_URL: ${{ vars.INGEST_URL_PROD }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN_PROD }}
        run: |
          if [ -z "$INGEST_URL" ]; then echo "INGEST_URL_PROD is empty; skipping"; exit 0; fi
          python3 publish.py report.json --url "$INGEST_URL" --token-env INGEST_TOKEN

      - name: Publish to demo
        if: ${{ github.event_name == 'schedule' || github.event.inputs.publish == 'true' }}
        env:
          INGEST_URL: ${{ vars.INGEST_URL_DEMO }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN_DEMO }}
        run: |
          if [ -z "$INGEST_URL" ]; then echo "INGEST_URL_DEMO is empty; skipping"; exit 0; fi
          python3 publish.py report.json --url "$INGEST_URL" --token-env INGEST_TOKEN

      - name: Verdict
        # Red on a mismatch (2) or when nothing was judged (1), after the
        # report has been uploaded and published so the evidence is kept.
        env:
          CODE: ${{ steps.run.outputs.code }}
        run: |
          echo "run_matrix exit code: $CODE"
          exit "$CODE"
